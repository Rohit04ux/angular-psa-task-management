@if(isAddingTask){
     <app-new-task (cancelTask)="cancelNewTask()" (addTask)="createTask($event)"/>
}


<div class="tasks">
    <header>
        <h1>{{name}}'s tasks</h1>
        <button (click)="addNewTask()">Add Task</button>
    </header>
</div>
